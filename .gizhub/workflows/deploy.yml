name: Deploy Portfolio to Home Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & build
      run: |
        npm install
        npm run build

    - name: Copy built files to portfolio folder
      run: |
        rm -rf /home/michael/portfolio/*
        cp -r dist/* /home/michael/portfolio/